name: Escaneo de secretos

# Bloquea cualquier credencial nueva en el árbol o en el historial.
# Usa el binario oficial de gitleaks, verificado contra un SHA-256 fijado del release oficial (sin acciones de terceros).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 del gitleaks_8.30.1_linux_x64.tar.gz oficial; actualizar junto con la versión.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Historial completo: el escaneo git necesita todos los commits, no solo el último.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # El escaneo no necesita el token de Git en el disco.
          persist-credentials: false

      - name: Instalar gitleaks
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$asset" "$base/$asset"
          # Se aborta si el binario no coincide con el SHA-256 fijado en el workflow.
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks

      # --redact evita que el propio log de CI vuelva a exponer el secreto encontrado.
      - name: Escanear árbol actual
        run: $RUNNER_TEMP/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Escanear historial
        run: $RUNNER_TEMP/gitleaks git . --config .gitleaks.toml --log-opts="--all" --redact --no-banner --exit-code 1
