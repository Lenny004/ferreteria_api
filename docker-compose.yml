services:
  postgres:
    image: postgres:17
    container_name: ferreteria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferreteria
      POSTGRES_USER: ferreteria_user
      # La contraseña se toma de .env (ver .env.example); el arranque falla si no está definida.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env (ver .env.example)}
    ports:
      # Solo localhost por defecto; cambie POSTGRES_BIND si otra máquina de la LAN debe conectarse.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      # Datos persistentes del contenedor
      - ferreteria-postgres-data:/var/lib/postgresql/data
      # Scripts de inicializacion (solo se ejecutan si el volumen esta vacio).
      # 01: extensiones, esquemas, funcion de timestamp y permisos.
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # Las tablas se crean con prisma migrate deploy; no montar el esquema legacy del POS.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferreteria_user -d ferreteria"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ferreteria-postgres-data:
    name: ferreteria-postgres-data
